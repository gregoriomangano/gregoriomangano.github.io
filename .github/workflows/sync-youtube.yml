name: Sync YouTube guides

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync public YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/sync_youtube.py
      - name: Build Guide pages and validate output
        run: python3 scripts/build_guides.py --check
      - name: Commit only real updates
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/youtube-videos.json guide index.html sitemap.xml robots.txt
          git commit -m 'Aggiorna guide YouTube'
          git push
